name: Hokas 自动续期

on:
  # 定时已暂停(2026-11-04): 确认手动触发运行成功且到账后，
  # 再取消下面两行的注释恢复每 6 小时自动续期:
  # schedule:
  #   - cron: "15 */6 * * *"
  workflow_dispatch:

# 同一时间只跑一个续期任务，避免重复点击 Add 按钮互相冲突
concurrency:
  group: hokas-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          pip install requests seleniumbase
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          seleniumbase install chromedriver || true

      - name: Run renew script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          # 密码登录（支持新建 PASSWORD 或复用 EMAIL_PASSWORD）
          PASSWORD: ${{ secrets.PASSWORD || secrets.EMAIL_PASSWORD }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          # 首选 Cookie 登录（在 Secrets 新建 COOKIES 变量，填入导出的 JSON 内容）
          COOKIES: ${{ secrets.COOKIES }}
          # 代理节点配置 (支持 http, socks5, vless, hysteria2/hy2, trojan, ss)
          PROXY: ${{ secrets.PROXY }}
          # 代理转换内核 (默认 sing-box，可选 xray)
          PROXY_CORE: ${{ secrets.PROXY_CORE }}
          # 服务器指定 (可选)
          SERVER_ID: ${{ secrets.SERVER_ID }}
          SERVER_NAME: ${{ secrets.SERVER_NAME }}
          # Telegram 通知 (可选)
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 面板与登录地址 (可选，脚本内已有默认值)
          PANEL_URL: ${{ secrets.PANEL_URL }}
          SIGN_IN_URL: ${{ secrets.SIGN_IN_URL }}
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 hokas.py 2>&1 | tee log.txt

      - name: Upload screenshots (失败排查用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Job Summary
        if: always()
        run: |
          echo "## Hokas 自动续期运行日志" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat log.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \vert{}\vert{} echo "log.txt 不存在" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "截图见本次运行的 Artifacts: screenshots" >> "$GITHUB_STEP_SUMMARY"
