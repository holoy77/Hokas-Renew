name: Hokas 自动续期

on:
  # 定时已暂停(2026-11-04): 首跑登录问题未彻底验证前, 不让失败的运行
  # 每 6 小时自动撞一次登录风控。首跑成功确认到账后, 再取消下面两行注释
  # 恢复定时:
  # schedule:
  #   - cron: "15 */6 * * *"
  workflow_dispatch:

# 同一时间只跑一个续期任务, 避免重复点击 Add 按钮互相干扰
concurrency:
  group: hokas-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          pip install -r requirements.txt
          pip install seleniumbase
          seleniumbase install chromedriver || true

      - name: Run renew script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          CODE_SOURCE: ${{ secrets.CODE_SOURCE }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          SIGN_IN_URL: ${{ secrets.SIGN_IN_URL }}
          SERVER_NAME: ${{ secrets.SERVER_NAME }}
          # 服务器 ID(可选, 如 b9275): 设置后优先按 ID 找卡片, 不怕名字拼错。
          SERVER_ID: ${{ secrets.SERVER_ID }}
          # 家宽代理节点(可选): 直连过不了 shrinkme 验证时, 配了它就走家宽 IP。
          # 在仓库 Settings -> Secrets 里新建名为 PROXY 的 Secret, 值形如
          # http://user:pass@host:port 或 socks5://user:pass@host:port。
          PROXY: ${{ secrets.PROXY }}
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 hokas.py 2>&1 | tee log.txt

      - name: Upload screenshots (失败排查用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Job Summary
        if: always()
        run: |
          echo "## Hokas 自动续期运行日志" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat log.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "log.txt 不存在" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "截图见本次运行的 Artifacts: screenshots" >> "$GITHUB_STEP_SUMMARY"
